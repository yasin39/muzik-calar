name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: ./gradlew assembleDebug --no-daemon

      - name: Sürümü oku ve APK adını düzenle
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/debug/app-debug.apk muzik-calar-v$VERSION.apk

      - uses: actions/upload-artifact@v4
        with:
          name: muzik-calar-apk
          path: muzik-calar-*.apk

      # versionName her aşamada artırılır; aynı sürüm tekrar derlenirse APK güncellenir.
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Müzik Çalar v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: muzik-calar-*.apk
